name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Download IntelliJ IDEA Platform for CI Compilation
      run: |
        mkdir -p /opt/idea
        curl -fSL https://download.jetbrains.com/idea/ideaIC-2024.3.3.tar.gz | tar -xz -C /opt/idea --strip-components=1
      shell: bash

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Plugin
      env:
        IDEA_HOME: /opt/idea
      run: ./gradlew buildPlugin -x test

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: git-multibranch-plugin
        path: build/distributions/*.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/distributions/*.zip
          build/libs/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
